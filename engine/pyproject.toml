[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "binance-bot"
version = "0.1.0"
description = "Desktop automation bot untuk aplikasi Binance di macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
bench = [
    "matplotlib>=3.8",
    "mplfinance>=0.12.10b0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
binance-bot = "binance_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["AppKit", "Quartz", "Vision", "Foundation"]
ignore_missing_imports = true
